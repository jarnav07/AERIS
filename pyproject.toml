[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-airfoil-predictor"
version = "0.2.0"
description = "ML surrogate models for airfoil aerodynamics trained on a shared XFOIL dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aerosandbox>=4.2",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
torch = ["torch>=2.3"]

[project.scripts]
airfoil-ml = "airfoil_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
