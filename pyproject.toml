[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-airfoil-predictor"
version = "0.1.0"
description = "An ML surrogate model for airfoil aerodynamic performance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Optional: enables the converged mlp_torch candidate. On Linux the default
# PyPI wheel bundles CUDA (~2 GB); for a CPU-only install prefer the CPU index
# command shown in the README.
torch = ["torch>=2.3"]

[project.scripts]
airfoil-ml = "airfoil_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
